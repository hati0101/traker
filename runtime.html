<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>widget</title>
<style>
/* ══════════════════════════════════════════════════════════════
   REVEAL RUNTIME v3
   규칙 1. 효과 전용 CSS 선택자는 FX 키와 글자 그대로 같을 것 (.cam ≠ .camera)
   규칙 2. 사진(.prize)은 z-index 1. 덮개는 10 이상, 사진 위로 올릴 것.
           (스캔이 z-index 11 검은판에 가려 안 보이는 사고 있었음)
   ══════════════════════════════════════════════════════════════ */
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,system-ui,sans-serif}
.mk-off *{animation-play-state:paused!important}

.card{position:relative;overflow:hidden;border-radius:var(--radius,18px);
  width:min(var(--w,370px),92vw,calc(94vh*var(--ar,.7048)));
  aspect-ratio:var(--arr,74/105);
  box-shadow:0 14px 32px rgba(0,0,0,.3);cursor:pointer;outline:none;
  background:#0b0a0e;user-select:none;touch-action:none;perspective:1000px}
.card:focus-visible{outline:3px solid #ffd66b;outline-offset:4px}
.prize{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;
  object-fit:var(--fit,cover);pointer-events:none}
.spark{position:absolute;z-index:60;pointer-events:none;will-change:transform,opacity}

.cap{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:40px 16px 14px;
  background:linear-gradient(transparent,rgba(6,5,9,.85));color:#f4f0f6;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .6s ease .45s,transform .7s cubic-bezier(.16,.84,.32,1) .45s}
.done .cap{opacity:1;transform:none}
.cap h1{margin:0;font-size:17px;font-weight:700;line-height:1.35}
.cap p{margin:4px 0 0;font-size:12.5px;color:#cfc7d8}

.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;
  padding:7px 14px;border-radius:999px;font-size:11.5px;letter-spacing:.04em;color:#f0eaf4;
  background:rgba(10,9,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);
  pointer-events:none;transition:opacity .3s;white-space:nowrap}
.hint.mid{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.done .hint,.busy .hint,.dragging .hint{opacity:0}

/* ─────────── 닦아내기 3종 공용 ─────────── */
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:20;
  touch-action:none;transition:opacity .85s ease;will-change:opacity}
.done #cv{opacity:0;pointer-events:none}
.wipe .prize{filter:var(--pre,none);transition:filter 1.1s ease}
.wipe.done .prize{filter:none}
/* 진행률 링 */
.wipe .prog{position:absolute;right:11px;top:11px;z-index:32;width:34px;height:34px;
  transition:opacity .45s ease}
.wipe .prog svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.wipe .prog circle{fill:none;stroke-width:3.2}
.wipe .prog .bgc{stroke:rgba(0,0,0,.22)}
.wipe .prog .fgc{stroke:var(--accent);stroke-linecap:round;
  stroke-dasharray:88;stroke-dashoffset:88;transition:stroke-dashoffset .18s linear;
  filter:drop-shadow(0 0 4px rgba(255,127,156,.6))}
.wipe .prog b{position:absolute;inset:0;display:grid;place-items:center;
  font:700 9px/1 ui-monospace,monospace;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.8)}
.wipe.done .prog{opacity:0}
/* 부스러기 */
.wipe .crumb{position:absolute;z-index:31;pointer-events:none;border-radius:1.5px;
  will-change:transform,opacity}
/* ─────────── camera ─────────── */
.camera{background:#07070a}
/* 렌즈 상: 초점 헌팅 → 잠금 → 개방 */
.camera .prize{transform:scale(1.2);
  filter:blur(var(--blur,40px)) saturate(.34) brightness(.62) contrast(.92);
  transition:filter 1.25s cubic-bezier(.16,.84,.32,1),transform 1.4s cubic-bezier(.16,.84,.32,1);
  animation:hunt 3.4s ease-in-out infinite}
@keyframes hunt{0%,100%{filter:blur(var(--blur,40px)) saturate(.34) brightness(.62) contrast(.92)}
  44%{filter:blur(calc(var(--blur,40px)*.64)) saturate(.44) brightness(.72) contrast(.96)}}
.camera.busy .prize{animation:none;transition:filter .42s ease,transform .42s ease;
  transform:scale(1.15);filter:blur(calc(var(--blur,40px)*.34)) saturate(.5) brightness(.78)}
.camera.done .prize{animation:none;transform:scale(1);
  filter:blur(0) saturate(1.06) brightness(1.02) contrast(1.02)}

/* 렌즈 보케 — 흐릴 때만 떠다니는 빛망울 */
.camera .bokeh{position:absolute;inset:0;z-index:2;pointer-events:none;
  transition:opacity .8s ease}
.camera .bokeh i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.34),rgba(255,225,240,.1) 60%,transparent 74%);
  animation:float var(--d,7s) ease-in-out infinite alternate}
@keyframes float{to{transform:translate(var(--tx,14px),var(--ty,-18px)) scale(1.14)}}
.camera.done .bokeh{opacity:0}

/* 뷰파인더 HUD */
.camera .hud{position:absolute;inset:0;z-index:12;pointer-events:none;
  font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;
  color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(0,0,0,.7);
  transition:opacity .5s ease}
.camera.done .hud{opacity:0}
.camera .hud .tl{position:absolute;left:7%;top:5.5%;display:flex;align-items:center;gap:5px}
.camera .hud .tr{position:absolute;right:7%;top:5.5%}
.camera .hud .bl{position:absolute;left:7%;bottom:5.5%}
.camera .hud .brr{position:absolute;right:7%;bottom:5.5%}
.camera .hud .rec{width:6px;height:6px;border-radius:50%;background:#ff4d5e;
  box-shadow:0 0 7px #ff4d5e;animation:blink 1.5s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.camera .hud .bat{display:inline-block;width:16px;height:8px;border:1px solid rgba(255,255,255,.7);
  border-radius:2px;position:relative;vertical-align:-1px;margin-left:5px}
.camera .hud .bat::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:64%;
  background:rgba(255,255,255,.8);border-radius:1px}
.camera .hud .bat::after{content:"";position:absolute;right:-3px;top:2px;bottom:2px;width:2px;
  background:rgba(255,255,255,.7);border-radius:0 1px 1px 0}

/* 구도 그리드 */
.grid{position:absolute;inset:0;z-index:11;opacity:.4;transition:opacity .45s;pointer-events:none}
.grid i{position:absolute;background:rgba(255,255,255,.26)}
.grid i:nth-child(1){left:33.33%;top:0;bottom:0;width:1px}
.grid i:nth-child(2){left:66.66%;top:0;bottom:0;width:1px}
.grid i:nth-child(3){top:33.33%;left:0;right:0;height:1px}
.grid i:nth-child(4){top:66.66%;left:0;right:0;height:1px}
.done .grid{opacity:0}

/* AF 프레임 — 크게 떠다니다 중앙으로 수축하며 잠김 */
.fc{position:absolute;left:50%;top:46%;width:58%;aspect-ratio:1/1;z-index:13;pointer-events:none;
  transform:translate(-50%,-50%);
  transition:transform .5s cubic-bezier(.3,1.3,.4,1),width .5s cubic-bezier(.3,1.3,.4,1),opacity .4s;
  animation:afdrift 3.4s ease-in-out infinite}
@keyframes afdrift{0%,100%{transform:translate(-50%,-50%)}
  35%{transform:translate(-56%,-53%)}70%{transform:translate(-45%,-47%)}}
.fc b{position:absolute;width:20%;height:20%;border:2px solid rgba(255,255,255,.75);
  transition:border-color .3s}
.fc b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
.fc b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 3px 0 0}
.fc b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 3px}
.fc b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 3px 0}
.camera.busy .fc{animation:none;width:36%;transform:translate(-50%,-50%) scale(1)}
.camera.busy .fc b{border-color:var(--accent);box-shadow:0 0 9px rgba(255,127,156,.65)}
.camera.lock .fc{animation:lockpulse .34s ease-out}
@keyframes lockpulse{0%{transform:translate(-50%,-50%) scale(1.14)}
  100%{transform:translate(-50%,-50%) scale(1)}}
.done .fc{opacity:0}
/* 초점 잠금 표시 */
.camera .afok{position:absolute;left:50%;top:46%;z-index:14;transform:translate(-50%,152%);
  font:700 9px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--accent);
  opacity:0;transition:opacity .2s;text-shadow:0 0 8px rgba(255,127,156,.7)}
.camera.lock .afok{opacity:1}
.done .afok{opacity:0!important}

/* 셔터 블레이드 — 위아래 + 좌우 4장 */
.blade{position:absolute;background:#05050880;z-index:22;backdrop-filter:blur(2px)}
.blade.t{left:0;right:0;top:0;height:52%;transform:translateY(-101%)}
.blade.b{left:0;right:0;bottom:0;height:52%;transform:translateY(101%)}
.blade.l{top:0;bottom:0;left:0;width:52%;transform:translateX(-101%)}
.blade.r{top:0;bottom:0;right:0;width:52%;transform:translateX(101%)}
.snap .blade.t{animation:bt .3s cubic-bezier(.3,0,.3,1)}
.snap .blade.b{animation:bb .3s cubic-bezier(.3,0,.3,1)}
.snap .blade.l{animation:bl .3s cubic-bezier(.3,0,.3,1) .03s}
.snap .blade.r{animation:br2 .3s cubic-bezier(.3,0,.3,1) .03s}
@keyframes bt{0%,100%{transform:translateY(-101%)}46%{transform:translateY(0)}}
@keyframes bb{0%,100%{transform:translateY(101%)}46%{transform:translateY(0)}}
@keyframes bl{0%,100%{transform:translateX(-101%)}46%{transform:translateX(0)}}
@keyframes br2{0%,100%{transform:translateX(101%)}46%{transform:translateX(0)}}

/* 플래시 — 화이트아웃 + 대각 스윕 + 렌즈 플레어 */
.pop{position:absolute;inset:0;z-index:24;background:#fff;opacity:0;pointer-events:none}
.snap .pop{animation:pp .34s ease-out .1s}
@keyframes pp{0%,100%{opacity:0}16%{opacity:.97}}
.sweep{position:absolute;inset:-25% -60%;z-index:25;opacity:0;pointer-events:none;
  background:linear-gradient(102deg,transparent 34%,rgba(255,255,255,.98) 48%,
    rgba(255,235,245,.72) 55%,transparent 68%)}
.snap .sweep{animation:sw .66s cubic-bezier(.3,.02,.2,1) .16s}
@keyframes sw{0%{opacity:0;transform:translateX(-72%)}18%{opacity:1}100%{opacity:0;transform:translateX(72%)}}
.flare{position:absolute;inset:0;z-index:26;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(circle at 30% 32%,rgba(255,235,190,.75),transparent 16%),
    radial-gradient(circle at 52% 48%,rgba(190,235,255,.55),transparent 11%),
    radial-gradient(circle at 70% 64%,rgba(255,190,220,.6),transparent 14%)}
.snap .flare{animation:fl .78s ease-out .16s}
@keyframes fl{0%,100%{opacity:0;transform:scale(.85)}26%{opacity:1}100%{transform:scale(1.25)}}

/* 노출 프레임 — 촬영 직후 사진이 자리잡는 느낌 */
.camera.done .frameFlash{animation:frameIn .6s cubic-bezier(.3,1.2,.4,1)}
.frameFlash{position:absolute;inset:0;z-index:27;pointer-events:none;border-radius:inherit;
  box-shadow:0 0 0 0 rgba(255,255,255,0) inset}
@keyframes frameIn{0%{box-shadow:0 0 0 5px rgba(255,255,255,.75) inset}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0) inset}}

/* 셔터 버튼 — 흰 링 하나 + 흰 원 하나. box-shadow 로 간격을 고정해 어긋남 없음 */
.shut{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);z-index:46;
  width:42px;height:42px;border:0;border-radius:50%;cursor:pointer;padding:0;
  background:#fff;
  box-shadow:0 0 0 3px rgba(0,0,0,.18),0 0 0 6px #fff,0 4px 14px -2px rgba(0,0,0,.6);
  transition:transform .16s ease,opacity .4s ease,background .3s ease}
.shut:active{transform:translateX(-50%) scale(.9)}
.camera.busy .shut{background:#ffd8e2}
.done .shut{opacity:0;pointer-events:none}
.shut:focus-visible{outline:2px solid #fff;outline-offset:8px}

/* ─────────── polaroid ─────────── */
.polaroid{background:linear-gradient(165deg,#1d1826,#0e0c14)}
/* 카메라 상단부 — 배출구 */
.polaroid .body3{position:absolute;left:0;right:0;top:0;height:13%;z-index:24;
  background:linear-gradient(#2b2536,#191424 62%,#0d0a13);
  border-radius:var(--radius,18px) var(--radius,18px) 4px 4px;
  box-shadow:0 6px 18px rgba(0,0,0,.75);transition:opacity .6s ease .5s}
.polaroid .body3::after{content:"";position:absolute;left:8%;right:8%;bottom:5px;height:5px;
  border-radius:3px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.12)}
.polaroid .body3 i{position:absolute;left:9%;top:32%;width:7px;height:7px;border-radius:50%;
  background:#ff5f74;box-shadow:0 0 8px #ff5f74;animation:blink 1.6s steps(1) infinite}
.polaroid .body3 b{position:absolute;right:9%;top:28%;font:600 8.5px/1 ui-monospace,monospace;
  letter-spacing:.16em;color:#7d7492}
.polaroid.done .body3{opacity:0}
/* 인화지 */
.polaroid .frame{position:absolute;left:5%;right:5%;top:11%;z-index:14;
  background:linear-gradient(#fffefb,#f1ede3);padding:5% 5% 15%;border-radius:3px;
  box-shadow:0 16px 34px rgba(0,0,0,.62),0 1px 0 rgba(255,255,255,.7) inset;
  transform:translateY(-112%) rotate(0deg);
  animation:eject 1.25s cubic-bezier(.24,.9,.3,1) .3s forwards}
@keyframes eject{60%{transform:translateY(4%) rotate(-1.4deg)}
  100%{transform:translateY(0) rotate(-.7deg)}}
.polaroid .win{position:relative;width:100%;aspect-ratio:1/1.1;overflow:hidden;background:#1b1e26;
  box-shadow:0 1px 6px rgba(0,0,0,.45) inset}
.polaroid .win img{width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(.18) contrast(.3) sepia(.8) blur(5px);transition:filter .5s ease}
/* 현상 얼룩 — 흔들수록 옅어짐 */
.polaroid .win::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 45% at 28% 32%,rgba(120,96,64,.5),transparent 70%),
    radial-gradient(50% 40% at 74% 68%,rgba(88,72,52,.45),transparent 72%);
  opacity:var(--devo,1);transition:opacity .3s linear}
.polaroid .memo{margin-top:6.5%;text-align:center;font-size:13px;color:#5b5361;letter-spacing:.01em}
/* 흔들기 게이지 */
.polaroid .shk{position:absolute;left:50%;bottom:5.5%;transform:translateX(-50%);z-index:34;
  display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
  background:rgba(10,9,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.16);
  transition:opacity .4s}
.polaroid .shk span{font-size:11px;color:#e4dcec;white-space:nowrap}
.polaroid .shk u{display:block;width:64px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.2);overflow:hidden}
.polaroid .shk u i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;
  transition:width .12s linear}
.polaroid.done .shk{opacity:0}
.polaroid.shaking .frame{animation:eject 1.25s cubic-bezier(.24,.9,.3,1) .3s forwards,
  wob .32s ease-in-out infinite}
@keyframes wob{0%,100%{margin-left:0}25%{margin-left:-4px}75%{margin-left:4px}}

/* ─────────── film ─────────── */
.film{background:#08070b}
.film .gate{position:absolute;top:9%;bottom:9%;left:0;right:0;z-index:12;overflow:hidden}
.film .strip{position:absolute;top:0;bottom:0;left:0;display:flex;will-change:transform}
.film .fr{flex:0 0 var(--fw,100%);height:100%;position:relative;overflow:hidden;
  border-right:3px solid #08070b;background:#16121d}
.film .fr img{width:100%;height:100%;object-fit:cover;display:block}
.film .fr.blank{background:
  radial-gradient(circle at 50% 42%,rgba(255,255,255,.05),transparent 60%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 10px,transparent 10px 22px),#171320}
.film .fr.blank::after{content:attr(data-n);position:absolute;left:9px;bottom:8px;
  color:#6c6182;font:600 10px/1 ui-monospace,monospace;letter-spacing:.24em}
/* 필름 베이스 색조 + 광학 사운드트랙 라인 */
.film .gate::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,140,60,.09),transparent 12%,transparent 88%,rgba(255,140,60,.09)),
    radial-gradient(120% 80% at 50% 50%,transparent 58%,rgba(0,0,0,.4) 100%);
  transition:opacity .6s ease .3s}
.film.done .gate::after{opacity:0}
.film.busy .gate{animation:gateShake .62s cubic-bezier(.3,.7,.4,1)}
@keyframes gateShake{0%,100%{transform:translateY(0)}
  18%{transform:translateY(-2px)}42%{transform:translateY(2px)}68%{transform:translateY(-1px)}}
.film.busy .strip{filter:blur(1.8px)}
/* 감기 중 셔터 플리커 */
.film .flick{position:absolute;inset:0;z-index:16;background:#000;opacity:0;pointer-events:none}
.film.busy .flick{animation:flick .1s steps(1) 14}
@keyframes flick{0%,60%{opacity:0}61%,100%{opacity:.42}}
.film .perf{position:absolute;left:0;right:0;height:9%;z-index:14;background:#08070b;overflow:hidden}
.film .perf.t{top:0}.film .perf.b{bottom:0}
.film .perf u{position:absolute;left:0;top:50%;display:flex;text-decoration:none;
  transform:translateY(-50%);will-change:transform}
.film .perf u i{display:block;width:11px;height:8px;margin-right:13px;border-radius:2px;
  background:#e9e3f0;flex:0 0 auto}
.film .perf.t::after{content:"KODAK 400TX  ▸  SAFETY FILM";position:absolute;left:14px;top:1px;
  color:#4a4159;font:600 6px/1 ui-monospace,monospace;letter-spacing:.2em}
/* 레버 — 링 + 손잡이 */
.film .lever{position:absolute;right:13px;bottom:15%;width:46px;height:46px;z-index:46;
  border-radius:50%;background:radial-gradient(circle at 38% 32%,#3a3247,#1a1624);
  box-shadow:0 0 0 2px #7a7091,0 4px 12px rgba(0,0,0,.6);cursor:pointer;
  transition:transform .9s cubic-bezier(.25,.85,.3,1),opacity .4s}
.film .lever::after{content:"";position:absolute;left:50%;top:5px;width:5px;height:17px;
  margin-left:-2.5px;border-radius:3px;background:var(--accent);
  box-shadow:0 0 7px rgba(255,127,156,.6)}
.film.busy .lever{transform:rotate(1080deg)}
.film.done .lever{opacity:0;pointer-events:none}
.film .counter{position:absolute;right:13px;top:12%;z-index:46;color:#a094bd;
  font:700 11px/1 ui-monospace,monospace;letter-spacing:.16em;
  padding:4px 8px;border-radius:5px;background:rgba(10,8,14,.6);
  border:1px solid rgba(255,255,255,.12);transition:opacity .4s}
.film.done .counter{opacity:0}
.film.done .gate{top:0;bottom:0;transition:top .65s ease .3s,bottom .65s ease .3s}
.film.done .perf{opacity:0;transition:opacity .5s .3s}

/* ─────────── gift ─────────── */
.gift{background:linear-gradient(165deg,#221a28,#120e18)}
.gift .bg2{position:absolute;inset:0;z-index:13;
  background:linear-gradient(165deg,#221a28,#120e18);transition:opacity .55s ease .3s}
.gift.done .bg2{opacity:0}
/* 바닥 그림자 */
.gift .shd{position:absolute;left:12%;right:12%;bottom:2%;height:5%;z-index:13;
  border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);
  transition:opacity .5s}
.gift.done .shd{opacity:0}
.gift .base{position:absolute;left:4%;right:4%;top:30%;bottom:5%;z-index:14;overflow:hidden;
  border-radius:3px 3px 7px 7px;
  background:linear-gradient(100deg,#b8637f 0 7%,#e79ab2 14%,#f0aec3 46%,#dd8ea8 78%,#b8637f);
  box-shadow:0 12px 26px rgba(0,0,0,.55);
  transition:transform .85s cubic-bezier(.5,0,.6,1) .14s,opacity .6s ease .3s}
/* 포장지 격자 무늬 */
.gift .base::after,.gift .lid::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 1px,transparent 1px 11px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.06) 0 1px,transparent 1px 11px)}
.gift .base::before{content:"";position:absolute;left:0;right:0;top:0;height:11px;z-index:2;
  background:linear-gradient(rgba(0,0,0,.5),transparent)}

/* ─────────── envelope ─────────── */
.envelope{background:linear-gradient(165deg,#221a26,#120e16)}
.envelope .env{position:absolute;left:4%;right:4%;top:12%;bottom:12%;z-index:14;
  border-radius:5px;background:linear-gradient(160deg,#fbf3e7,#e6d7c1);
  box-shadow:0 18px 38px rgba(0,0,0,.6);transition:opacity .5s,transform .6s}
/* 항공우편 테두리 */
.envelope .env::after{content:"";position:absolute;inset:0;border-radius:5px;
  border:5px solid transparent;
  background:repeating-linear-gradient(45deg,#c9455e 0 9px,#fff 9px 18px,#3a63a8 18px 27px,#fff 27px 36px) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.envelope .letter{position:absolute;left:9%;right:9%;top:16%;bottom:16%;z-index:16;
  overflow:hidden;background:#fffdf8;border-radius:3px;
  box-shadow:0 12px 26px rgba(0,0,0,.45);transform:translateY(72%);
  transition:transform 1s cubic-bezier(.3,.95,.3,1) .45s}
.envelope .letter img{width:100%;height:100%;object-fit:cover;display:block}

.envelope.st2 .letter{left:0;right:0;top:0;bottom:0;transform:none;z-index:34;

    transform .55s ease,border-radius .55s ease}
.envelope .hide{position:absolute;left:0;right:0;bottom:0;height:13%;z-index:17;
  background:#120e16;transition:opacity .4s}
.envelope .pocket{position:absolute;left:4%;right:4%;top:12%;bottom:12%;z-index:18;
  border-radius:5px;background:linear-gradient(165deg,#f3e8d8,#e0cdb2 62%,#d0bb9c);
  clip-path:polygon(0 0,50% 44%,100% 0,100% 100%,0 100%);
  transition:opacity .5s .35s}
.envelope .pocket::after{content:"";position:absolute;inset:0;
  background:linear-gradient(202deg,transparent 45.4%,rgba(150,116,78,.3) 46%,transparent 46.6%),
             linear-gradient(-202deg,transparent 45.4%,rgba(150,116,78,.3) 46%,transparent 46.6%)}
.envelope .flapE{position:absolute;left:4%;right:4%;top:12%;height:38%;z-index:19;
  transform-origin:50% 0;border-radius:5px 5px 0 0;
  background:linear-gradient(#fdf7ee,#ede0cd 72%,#ddc9ae);
  clip-path:polygon(0 0,100% 0,50% 100%);
  filter:drop-shadow(0 6px 8px rgba(90,66,42,.34));
  transition:transform .85s cubic-bezier(.4,1.15,.45,1)}
.envelope.busy .flapE,.envelope.done .flapE{transform:rotateX(-176deg)}
/* 우표 — 톱니 테두리 */
.envelope .stamp{position:absolute;right:10%;top:16%;width:18%;aspect-ratio:1/1.24;z-index:20;
  background:
    linear-gradient(150deg,rgba(255,255,255,.35),transparent 60%),
    repeating-linear-gradient(45deg,#e9c9d6 0 7px,#d9aec2 7px 14px);
  border-radius:2px;transition:opacity .4s;
  filter:drop-shadow(0 2px 4px rgba(90,66,42,.35))}
.envelope .stamp::before{content:"";position:absolute;inset:-3px;border-radius:3px;
  background:#fdfaf4;z-index:-1;
  -webkit-mask:radial-gradient(circle 3px at 0 0,transparent 98%,#000) 0 0/9px 9px;
  mask:radial-gradient(circle 3px at 0 0,transparent 98%,#000) 0 0/9px 9px}
.envelope .stamp::after{content:"♡";position:absolute;inset:0;display:grid;place-items:center;

/* 소인 */
.envelope .mark{position:absolute;right:6%;top:13%;width:26%;aspect-ratio:1/1;z-index:21;

.envelope .mark::after{content:"SOOP";position:absolute;inset:0;display:grid;place-items:center;

.envelope .seal::after{content:"♡";position:absolute;inset:0;display:grid;place-items:center;

.envelope.st2 .pocket,.envelope.st2 .flapE,.envelope.st2 .env,
.envelope.st2 .stamp,.envelope.st2 .mark,.envelope.st2 .hide{opacity:0}

.unlock{background:#08070c}

.unlock .track span{position:absolute;inset:0;display:grid;place-items:center;
  font-size:12.5px;letter-spacing:.1em;padding-left:26px;
  background:linear-gradient(90deg,rgba(255,255,255,.18) 25%,rgba(255,255,255,.88) 50%,rgba(255,255,255,.18) 75%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 2.4s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
/* 지나간 자리에 채워지는 빛 */
.unlock .track .fillx{position:absolute;left:0;top:0;bottom:0;width:0;
  background:linear-gradient(90deg,rgba(255,127,156,.45),rgba(255,127,156,.12));
  transition:width .1s linear}
.smooth .track .fillx{transition:width .45s cubic-bezier(.3,.9,.25,1)}
.unlock .grab{position:absolute;left:3px;top:3px;bottom:3px;width:50px;z-index:19;
  border-radius:99px;background:#fff;cursor:grab;
  box-shadow:0 3px 10px rgba(0,0,0,.45);transition:transform .1s linear}
.smooth .grab{transition:transform .45s cubic-bezier(.3,.9,.25,1)}
.unlock .grab::after{content:"›";position:absolute;inset:0;display:grid;place-items:center;
  color:#2a2336;font-weight:800;font-size:22px;line-height:1}
.unlock .grab::before{content:"";position:absolute;inset:0;border-radius:99px;
  box-shadow:0 0 0 0 rgba(255,255,255,.5);animation:pulseG 2s ease-out infinite}
@keyframes pulseG{70%,100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
.unlock.done .track{opacity:0}
.unlock .hint{bottom:auto;top:64%}

/* ─────────── origami ─────────── */
.origami .fold{position:absolute;inset:0;z-index:14;transform-style:preserve-3d;
  transition:transform .75s cubic-bezier(.4,1.1,.4,1),opacity .5s .18s}
.origami .fold.f1{clip-path:polygon(0 0,100% 0,50% 50%);transform-origin:50% 0;
  background:linear-gradient(180deg,#fffaf1,#f0e5d3);z-index:18}
.origami .fold.f2{clip-path:polygon(100% 0,100% 100%,50% 50%);transform-origin:100% 50%;
  background:linear-gradient(270deg,#f8f0e2,#e7dac6);z-index:17}
.origami .fold.f3{clip-path:polygon(100% 100%,0 100%,50% 50%);transform-origin:50% 100%;
  background:linear-gradient(0deg,#f2e8d8,#e0d2bc);z-index:16}
.origami .fold.f4{clip-path:polygon(0 100%,0 0,50% 50%);transform-origin:0 50%;
  background:linear-gradient(90deg,#ece1cf,#dbccb4);z-index:15}
.origami .fold::after{content:"";position:absolute;inset:0;
  background:linear-gradient(135deg,transparent 48%,rgba(150,120,80,.22) 50%,transparent 52%)}
.origami .fold.open.f1{transform:rotateX(-168deg)}
.origami .fold.open.f2{transform:rotateY(168deg)}
.origami .fold.open.f3{transform:rotateX(168deg)}
.origami .fold.open.f4{transform:rotateY(-168deg)}
.origami .fold.open{opacity:0}
.origami .step{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:46;
  width:36px;height:36px;border-radius:50%;background:rgba(20,16,26,.55);
  border:1px solid rgba(255,255,255,.28);color:#fff;font-size:12px;font-weight:700;
  display:grid;place-items:center;pointer-events:none;transition:opacity .3s}
.origami.done .step{opacity:0}

/* ─────────── snowglobe ─────────── */
.snowglobe{background:radial-gradient(120% 90% at 50% 20%,#1b2440,#080b16)}
/* 구슬 안쪽으로만 사진을 가두는 원형 마스크 */
.snowglobe .orb{position:absolute;left:6%;right:6%;top:4%;z-index:14;aspect-ratio:1/1;
  border-radius:50%;overflow:hidden;
  box-shadow:0 22px 44px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.16);
  transition:border-radius .9s ease .35s,left .9s ease .35s,right .9s ease .35s,
    top .9s ease .35s,height .9s ease .35s,box-shadow .9s ease .35s}
.snowglobe .orb img{width:100%;height:100%;object-fit:cover;display:block;
  filter:blur(8px) brightness(.62) saturate(.66);transition:filter 1.2s ease}
.snowglobe.done .orb{left:0;right:0;top:0;aspect-ratio:auto;height:100%;
  border-radius:var(--radius,18px);box-shadow:none}
.snowglobe.done .orb img{filter:none}
/* 유리 굴절 + 하이라이트 */
.snowglobe .glass{position:absolute;inset:0;z-index:20;pointer-events:none;border-radius:50%;
  background:
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.62),transparent 26%),
    radial-gradient(circle at 68% 76%,rgba(190,220,255,.3),transparent 22%),
    radial-gradient(circle at 50% 50%,transparent 56%,rgba(10,16,34,.5) 78%,rgba(6,10,24,.85) 100%);
  transition:opacity 1s ease}
.snowglobe.done .glass{opacity:0}
.snowglobe .flakes{position:absolute;inset:0;z-index:18;pointer-events:none;overflow:hidden;
  border-radius:50%;transition:border-radius .9s ease .35s}
.snowglobe.done .flakes{border-radius:var(--radius,18px)}
.snowglobe .flakes i{position:absolute;border-radius:50%;background:#fff;
  filter:drop-shadow(0 0 4px rgba(200,230,255,.95))}
/* 나무 받침대 */
.snowglobe .stand{position:absolute;left:11%;right:11%;bottom:2%;height:15%;z-index:22;
  border-radius:8px 8px 12px 12px;
  background:linear-gradient(#8a5f38 0 14%,#6b4526 14% 62%,#4a2f18);
  box-shadow:0 -4px 12px rgba(0,0,0,.55),0 8px 20px rgba(0,0,0,.5),
    0 2px 0 rgba(255,255,255,.18) inset;
  transition:opacity .7s ease .25s,transform .7s ease .25s}
.snowglobe .stand::before{content:"";position:absolute;left:-3%;right:-3%;top:-6px;height:12px;
  border-radius:50%/60%;background:linear-gradient(#a3743f,#7a5129)}
.snowglobe .stand b{position:absolute;left:14%;right:14%;top:44%;height:34%;border-radius:3px;
  background:linear-gradient(#d8b378,#b8894c);
  box-shadow:0 1px 3px rgba(0,0,0,.4) inset}
.snowglobe .stand b::after{content:attr(data-t);position:absolute;inset:0;
  display:grid;place-items:center;font:700 8px/1 sans-serif;letter-spacing:.14em;
  color:#5c3d1c;white-space:nowrap;overflow:hidden}
.snowglobe.done .stand{opacity:0;transform:translateY(24px)}
/* 흔들기 게이지 */
.snowglobe .shk{position:absolute;left:50%;bottom:20%;transform:translateX(-50%);z-index:34;
  display:flex;align-items:center;gap:8px;padding:6px 13px;border-radius:99px;
  background:rgba(8,12,26,.6);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.2);transition:opacity .4s;white-space:nowrap}
.snowglobe .shk span{font-size:11.5px;color:#e6eef8}
.snowglobe .shk u{display:block;width:62px;height:4px;border-radius:99px;
  background:rgba(255,255,255,.22);overflow:hidden}
.snowglobe .shk u i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#bfe4ff,#fff);transition:width .12s linear}
.snowglobe.done .shk{opacity:0}
.snowglobe.wob .orb{animation:orbwob .34s ease-in-out infinite}
@keyframes orbwob{0%,100%{transform:translateX(0) rotate(0)}
  25%{transform:translateX(-5px) rotate(-.7deg)}75%{transform:translateX(5px) rotate(.7deg)}}

/* ─────────── slot ─────────── */
.slot{background:linear-gradient(#2c1033,#150818)}
.slot .cab{position:absolute;inset:0;z-index:12;
  background:linear-gradient(#3a1544 0 14%,#250e2c 14% 100%);transition:opacity .55s .3s}
.slot .cab::after{content:"★ LUCKY ★";position:absolute;left:0;right:0;top:5%;text-align:center;
  color:#ffd76b;font-size:13px;font-weight:800;letter-spacing:.2em;
  text-shadow:0 0 14px rgba(255,200,80,.8)}
.slot .machine{position:absolute;left:8%;right:22%;top:26%;height:30%;z-index:14;
  display:flex;gap:5px;padding:7px;border-radius:10px;
  background:#0b0610;border:2px solid #8257a3;box-shadow:inset 0 0 22px rgba(0,0,0,.9),
    0 0 18px rgba(190,120,230,.35);transition:opacity .55s .3s}
.slot .reel{flex:1;overflow:hidden;border-radius:6px;background:linear-gradient(#fff,#efe7f7);position:relative}
.slot .reel::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(0,0,0,.3),transparent 26%,transparent 74%,rgba(0,0,0,.3))}
.slot .reel u{position:absolute;left:0;right:0;top:0;text-decoration:none;
  display:flex;flex-direction:column;align-items:center}
.slot .reel u b{height:var(--rh,52px);line-height:var(--rh,52px);font-size:27px;font-weight:400}
.slot .lever2{position:absolute;right:11%;top:24%;width:11px;height:34%;z-index:16;
  background:linear-gradient(#9a88b4,#524466);border-radius:99px;transform-origin:50% 100%;
  cursor:pointer;transition:transform .45s cubic-bezier(.4,1.6,.5,1),opacity .5s .3s}
.slot .lever2::before{content:"";position:absolute;left:50%;top:-15px;width:28px;height:28px;
  margin-left:-14px;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#ffa9bd,var(--accent) 58%,#8d2247);
  box-shadow:0 3px 9px rgba(0,0,0,.55)}
.slot.busy .lever2{transform:rotate(34deg)}
.slot .jack{position:absolute;left:0;right:0;top:60%;z-index:20;text-align:center;
  font-size:23px;font-weight:800;letter-spacing:.06em;color:#ffd76b;opacity:0;
  text-shadow:0 0 20px rgba(255,200,80,.95);transform:scale(.7)}
.slot.win .jack{animation:jk .7s cubic-bezier(.3,1.6,.4,1) forwards}
@keyframes jk{to{opacity:1;transform:scale(1)}}
.slot.done .cab,.slot.done .machine,.slot.done .lever2{opacity:0;pointer-events:none}
.slot.done .jack{animation:none!important;opacity:0;transition:opacity .5s;pointer-events:none}

/* ─────────── holo ─────────── */
.holo{background:#0d0a14}
.holo .prize{opacity:0;transition:opacity .16s linear}
.holo .prize.b{z-index:2}
.holo .foil{position:absolute;inset:0;z-index:10;pointer-events:none;
  background:
    repeating-linear-gradient(104deg,
      rgba(255,60,160,.5) 0 14px,rgba(255,215,60,.46) 14px 28px,rgba(60,240,180,.48) 28px 42px,
      rgba(70,160,255,.5) 42px 56px,rgba(200,90,255,.46) 56px 70px),
    linear-gradient(#1b1526,#0d0a14);
  transition:opacity .5s ease}
.holo .sheen{position:absolute;inset:-40%;z-index:14;pointer-events:none;mix-blend-mode:color-dodge;
  background:linear-gradient(104deg,transparent 26%,rgba(255,255,255,.5) 42%,
    rgba(255,190,240,.42) 50%,rgba(170,240,255,.45) 58%,transparent 74%);
  transition:opacity .25s linear}
.holo .glare{position:absolute;inset:0;z-index:15;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--gx,50%) 38%,rgba(255,255,255,.4),transparent 40%)}
.holo .edge{position:absolute;inset:0;z-index:16;pointer-events:none;border-radius:inherit;
  box-shadow:0 0 0 2px rgba(255,255,255,.3) inset}
.holo.done .foil{opacity:.1}
.holo.done .glare{opacity:0}
.holo.done .prize.b{opacity:1!important;transition:opacity .6s ease}

/* ─────────── scan ─────────── */
/* ※ .dark 는 z-index 0 — 사진(1)보다 아래. 위에 두면 영원히 검은 화면이 됨 */
.scan{background:#050710}
.scan .prize{clip-path:inset(0 0 100% 0);transition:clip-path .12s linear}
.scan.busy .prize{transition:clip-path 1.9s linear}
.scan.done .prize{clip-path:inset(0)}
.scan .dark{position:absolute;inset:0;z-index:0;background:#050710;
  background-image:
    repeating-linear-gradient(0deg,rgba(90,255,190,.075) 0 1px,transparent 1px 6px),
    repeating-linear-gradient(90deg,rgba(90,255,190,.05) 0 1px,transparent 1px 26px)}
/* 아직 스캔 안 된 영역의 와이어프레임 */
.scan .wire{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(60% 40% at 50% 34%,rgba(90,255,190,.11),transparent 70%),
    repeating-linear-gradient(45deg,rgba(90,255,190,.045) 0 1px,transparent 1px 14px);
  transition:opacity .6s ease}
.scan.done .wire{opacity:0}
/* 노이즈 스캔라인 오버레이 */
.scan .crt{position:absolute;inset:0;z-index:21;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.32) 0 1px,transparent 1px 3px);
  transition:opacity .7s ease}
.scan.done .crt{opacity:0}
/* 코너 브래킷 — 스캔 중 수축 */
.scan .br{position:absolute;inset:0;z-index:20;pointer-events:none;
  transition:opacity .5s,transform .5s cubic-bezier(.3,1.2,.4,1)}
.scan .br i{position:absolute;width:30px;height:30px;border:2px solid #7dffcf;
  box-shadow:0 0 14px rgba(90,255,190,.65)}
.scan .br i:nth-child(1){left:6%;top:5%;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
.scan .br i:nth-child(2){right:6%;top:5%;border-left:0;border-bottom:0;border-radius:0 4px 0 0}
.scan .br i:nth-child(3){left:6%;bottom:5%;border-right:0;border-top:0;border-radius:0 0 0 4px}
.scan .br i:nth-child(4){right:6%;bottom:5%;border-left:0;border-top:0;border-radius:0 0 4px 0}
.scan.busy .br{transform:scale(.955)}
.scan.done .br{opacity:0}
/* 스캔 라인 — 헤드 + 잔광 꼬리 */
.scan .line{position:absolute;left:0;right:0;top:0;height:2px;z-index:24;opacity:0;
  background:#c9ffe9;box-shadow:0 0 20px 7px rgba(90,255,190,.85)}
.scan .line::after{content:"";position:absolute;left:0;right:0;top:-58px;height:58px;
  background:linear-gradient(transparent,rgba(90,255,190,.3))}
.scan.busy .line{animation:scanline 1.9s linear forwards}
@keyframes scanline{0%{opacity:1;top:0}97%{opacity:1}100%{top:100%;opacity:0}}
/* 스캔 통과 지점 좌우 눈금 */
.scan .ticks{position:absolute;inset:0;z-index:22;pointer-events:none;opacity:0;
  transition:opacity .4s}
.scan.busy .ticks{opacity:1}
.scan .ticks i{position:absolute;width:9px;height:2px;background:#7dffcf;
  box-shadow:0 0 8px rgba(90,255,190,.8)}
.scan .ticks i:first-child{left:0}.scan .ticks i:last-child{right:0}
.scan.done .ticks{opacity:0}
/* HUD */
.scan .hud2{position:absolute;inset:0;z-index:23;pointer-events:none;
  font:600 9px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;
  color:#7dffcf;text-shadow:0 0 8px rgba(90,255,190,.6);transition:opacity .5s}
.scan .hud2 .tl2{position:absolute;left:8%;top:9%}
.scan .hud2 .tr2{position:absolute;right:8%;top:9%;text-align:right}
.scan .hud2 .bl2{position:absolute;left:8%;bottom:9%}
.scan.done .hud2{opacity:0}
/* 진행 바 */
.scan .pctT{position:absolute;left:8%;right:8%;bottom:15%;z-index:23;text-align:center;
  color:#7dffcf;font:700 11px/1 ui-monospace,monospace;letter-spacing:.2em;
  transition:opacity .4s}
.scan .pctT u{display:block;height:3px;margin-top:7px;border-radius:99px;
  background:rgba(125,255,207,.2);overflow:hidden}
.scan .pctT u i{display:block;height:100%;width:0;background:#7dffcf;border-radius:99px;
  box-shadow:0 0 9px rgba(90,255,190,.9)}
.scan.done .pctT{opacity:0}
/* 완료 체크 */
.scan .tick{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.4);z-index:34;
  font-size:54px;color:#7dffcf;opacity:0;text-shadow:0 0 26px rgba(90,255,190,.95)}
.scan.done .tick{animation:tk 1s cubic-bezier(.3,1.5,.4,1) forwards}
@keyframes tk{28%{opacity:1;transform:translate(-50%,-50%) scale(1.14)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.32)}}
/* 완료 플래시 링 */
.scan.done .ringF{animation:ringF .75s cubic-bezier(.3,.9,.4,1)}
.ringF{position:absolute;inset:0;z-index:33;pointer-events:none;border-radius:inherit}
@keyframes ringF{0%{box-shadow:0 0 0 4px rgba(125,255,207,.85) inset}
  100%{box-shadow:0 0 0 0 rgba(125,255,207,0) inset}}


@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.14s!important}}

<body>
<script>
const P = new URLSearchParams(location.search), g = (k,d) => P.get(k) ?? d;
const cfg = {
  fx:g('fx','scratch'), img:g('img',''), img2:g('img2',''), cover:g('cover',''),
  label:g('label',''), title:g('title',''), sub:g('sub',''),
  ratio:g('ratio','74/105'), fit:g('fit','cover'), accent:g('accent','#ff7f9c'),
  radius:g('radius','18'), blur:+g('blur',40),
  meta:g('meta','ISO 200'), lens:g('lens','35mm F1.8'), pct:+g('pct',52)/100, auto:g('auto','')==='1'
};
const PH = "data:image/svg+xml;utf8,"+encodeURIComponent(
`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3c7"/>
<stop offset=".5" stop-color="#c9a7ff"/><stop offset="1" stop-color="#7fd8e8"/></linearGradient></defs>
<rect width="600" height="800" fill="url(#g)"/><text x="300" y="410" text-anchor="middle"
font-family="sans-serif" font-size="30" font-weight="700" fill="#fff" opacity=".9">img 파라미터 없음</text></svg>`);

const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IMG = esc(cfg.img || PH), IMG2 = esc(cfg.img2 || cfg.img || PH);
const [rw,rh] = cfg.ratio.split('/').map(Number);

const card = document.createElement('div');
card.tabIndex = 0; card.setAttribute('role','button');
card.style.cssText = `--arr:${rw}/${rh};--ar:${(rw/rh).toFixed(4)};--fit:${cfg.fit};`+
  `--accent:${cfg.accent};--radius:${cfg.radius}px;--blur:${cfg.blur}px`;

const cap = (cfg.title||cfg.sub)
  ? `<div class="cap">${cfg.title?`<h1>${esc(cfg.title)}</h1>`:''}${cfg.sub?`<p>${esc(cfg.sub)}</p>`:''}</div>` : '';
const hint = (t,mid) => `<div class="hint${mid?' mid':''}">${esc(cfg.label||t)}</div>`;
const BOW = `<svg viewBox="0 0 128 84" xmlns="http://www.w3.org/2000/svg"><defs>
<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#fff7d9"/><stop offset=".5" stop-color="#f6d478"/>
<stop offset="1" stop-color="#d9a52f"/></linearGradient>
<linearGradient id="gk" x1=".3" y1="0" x2=".7" y2="1">
<stop offset="0" stop-color="#fffbe8"/><stop offset=".55" stop-color="#ffdf85"/>
<stop offset="1" stop-color="#cf9c28"/></linearGradient></defs>
<path d="M60 42 C34 6 4 12 6 33 C8 54 38 55 60 42 Z" fill="url(#gb)"/>
<path d="M68 42 C94 6 124 12 122 33 C120 54 90 55 68 42 Z" fill="url(#gb)"/>
<path d="M57 48 L40 82 L58 72 Z" fill="url(#gb)"/>
<path d="M71 48 L88 82 L70 72 Z" fill="url(#gb)"/>
<path d="M60 42 C34 6 4 12 6 33" fill="none" stroke="rgba(150,105,20,.35)" stroke-width="2"/>
<path d="M68 42 C94 6 124 12 122 33" fill="none" stroke="rgba(150,105,20,.35)" stroke-width="2"/>
<ellipse cx="64" cy="43" rx="14" ry="12" fill="url(#gk)"/>
<ellipse cx="60" cy="39" rx="5" ry="4" fill="rgba(255,255,255,.55)"/></svg>`;
const prize = (cls='') => `<img class="prize ${cls}" src="${IMG}" alt="">`;

let finished = false;
function sparks(n,col){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = col || ['#fff','#ffd2dd',cfg.accent,'#fff0b8'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='spark';
    s.textContent = Math.random()<.6?'✦':'•';
    s.style.cssText += `left:50%;top:48%;font:700 ${8+Math.random()*14}px sans-serif;color:${cols[i%cols.length]};
      text-shadow:0 0 8px rgba(255,200,220,.9);transform:translate(-50%,-50%)`;
    card.appendChild(s);
    const a=Math.random()*6.283, d=70+Math.random()*140;
    s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-20}px)) scale(1.15) rotate(${Math.random()*220-110}deg)`,opacity:0}],
      {duration:620+Math.random()*420,easing:'cubic-bezier(.15,.75,.4,1)'}).onfinish=()=>s.remove();
  }
}
function finish(n=14,col){ if(finished) return; finished=true;
  card.classList.remove('busy'); card.classList.add('done'); sparks(n,col); }

function drag(el,{axis='x',span=()=>card.clientWidth*.42,onMove,thresh=.55,onDone,onCancel}){
  let start=null, p=0;
  el.addEventListener('pointerdown',e=>{ if(finished) return;
    start = axis==='x'?e.clientX:e.clientY; card.classList.add('dragging');
    card.classList.remove('smooth');
    try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove',e=>{ if(start===null||finished) return;
    const cur = axis==='x'?e.clientX:e.clientY;
    p = Math.max(0,Math.min(1,Math.abs(cur-start)/span())); onMove && onMove(p); });
  const up=()=>{ if(start===null) return; start=null; card.classList.remove('dragging');
    card.classList.add('smooth');
    if(p>thresh) onDone && onDone(); else { onCancel&&onCancel(); onMove&&onMove(0);
      setTimeout(()=>card.classList.remove('smooth'),900); } };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
}
function shake(el,need,onProg,onDone){
  let acc=0,lx=null,ly=null;
  el.addEventListener('pointermove',e=>{ if(finished) return;
    if(lx!==null){ acc += Math.hypot(e.clientX-lx,e.clientY-ly); onProg&&onProg(Math.min(1,acc/need));
      if(acc>need) onDone(); }
    lx=e.clientX; ly=e.clientY; });
}

/* ══════════ 닦아내기 엔진 ══════════ */
function wipeFx({paint,pre,label,noHint,crumb,brush}){ return {
  cls:'wipe',
  html: () => `${prize()}${cap}<canvas id="cv"></canvas>
    <div class="prog"><svg viewBox="0 0 32 32"><circle class="bgc" cx="16" cy="16" r="14"/>
    <circle class="fgc" cx="16" cy="16" r="14"/></svg><b>0%</b></div>
    ${noHint?'':hint(label,true)}`,
  init(){
    if(pre) card.style.setProperty('--pre',pre);
    const cv=card.querySelector('#cv'), dpr=Math.min(devicePixelRatio||1,2);
    const ring=card.querySelector('.prog .fgc'), pnum=card.querySelector('.prog b');
    let ctx,W,H,grid,cnt,drawing=false,lx,ly,sid=null;
    const GW=20,GH=26,total=GW*GH;

    function setup(){
      W=cv.width=Math.round(card.clientWidth*dpr); H=cv.height=Math.round(card.clientHeight*dpr);
      ctx=cv.getContext('2d'); grid=new Array(total); cnt=0;
      ctx.globalCompositeOperation='source-over'; paint(ctx,W,H,dpr);
      if(cfg.cover){ const im=new Image(); im.onload=()=>{ if(cnt===0&&!finished){
        ctx.globalCompositeOperation='source-over';
        const f=Math.max(W/im.width,H/im.height);
        ctx.drawImage(im,W/2-im.width*f/2,H/2-im.height*f/2,im.width*f,im.height*f); } };
        im.src=cfg.cover; }
    }
    function progress(){
      const r=Math.min(1,(cnt/total)/cfg.pct);
      ring.style.strokeDashoffset = (88*(1-r)).toFixed(1);
      pnum.textContent = Math.round(r*100)+'%';
    }
    function mark(x,y){
      const R=W*.082,cx=Math.floor(x/W*GW),cy=Math.floor(y/H*GH),rr=Math.ceil(R/(W/GW));
      for(let i=cx-rr;i<=cx+rr;i++)for(let j=cy-rr;j<=cy+rr;j++){
        if(i<0||j<0||i>=GW||j>=GH)continue; const k=j*GW+i; if(!grid[k]){grid[k]=1;cnt++;} }
      progress();
      if(!finished&&cnt/total>cfg.pct) finish(18);
    }
    // 부스러기 튀기기
    let lastCrumb=0;
    function fleck(cx,cy){
      if(!crumb) return;
      const now=Date.now(); if(now-lastCrumb<46) return; lastCrumb=now;
      if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const r=cv.getBoundingClientRect(), sc=r.width/W;
      for(let i=0;i<2;i++){
        const el=document.createElement('span'); el.className='crumb';
        const d=1.6+Math.random()*3.4;
        el.style.cssText+=`left:${cx*sc}px;top:${cy*sc}px;width:${d}px;height:${d*(.6+Math.random()*.8)}px;`+
          `background:${crumb[(Math.random()*crumb.length)|0]}`;
        card.appendChild(el);
        const a=Math.random()*6.283, dist=14+Math.random()*30;
        el.animate([{transform:'translate(-50%,-50%) rotate(0)',opacity:.95},
          {transform:`translate(calc(-50% + ${Math.cos(a)*dist}px),calc(-50% + ${Math.sin(a)*dist+16}px)) rotate(${Math.random()*260-130}deg)`,opacity:0}],
          {duration:420+Math.random()*380,easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish=()=>el.remove();
      }
    }
    function draw(x,y){
      ctx.globalCompositeOperation='destination-out';
      const w=W*(brush||.165);
      ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#000';
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke();
      // 가장자리를 톱니처럼 — 매끈한 선이 아니라 문지른 자국처럼
      for(let i=0;i<3;i++){
        const t=Math.random(), px=lx+(x-lx)*t, py=ly+(y-ly)*t;
        ctx.beginPath();
        ctx.arc(px+(Math.random()-.5)*w*.9, py+(Math.random()-.5)*w*.9,
                w*(.2+Math.random()*.3),0,7); ctx.fill();
      }
      lx=x; ly=y; mark(x,y); fleck(x,y);
    }
    const pos=e=>{ const r=cv.getBoundingClientRect();
      return [(e.clientX-r.left)*W/Math.max(1,r.width),(e.clientY-r.top)*H/Math.max(1,r.height)]; };
    cv.addEventListener('pointerdown',e=>{ if(drawing)return; sid=e.pointerId; drawing=true;
      const p=pos(e); lx=p[0]; ly=p[1]; draw(p[0]+.1,p[1]+.1);
      try{cv.setPointerCapture(e.pointerId);}catch(_){} });
    cv.addEventListener('pointermove',e=>{ if(drawing&&e.pointerId===sid){const p=pos(e);draw(p[0],p[1]);} });
    const up=e=>{ if(e.pointerId===sid){drawing=false;sid=null;} };
    cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
    setup(); progress();
    let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!finished)setup();},250);});
    return ()=>finish(18);
  }};
}
/* 둥근 사각 경로/* 둥근 사각 경로 (구버전 사파리 roundRect 없음 대비) */
function rrect(c,x,y,w,h,r){ c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

blind: {
  html: () => `${prize()}${cap}<div class="slats"></div><div class="cordB"></div>

    const s=card.querySelector('.slats'), cord=card.querySelector('.cordB');

unlock: {
  html: () => {
    const d=new Date();
    const hh=d.getHours(), ampm=hh<12?'오전':'오후', h12=hh%12||12;
    const day=['일','월','화','수','목','금','토'][d.getDay()];

      <div class="veilU"><img class="bgimg" src="${IMG}" alt=""></div>
      <div class="lockIco"></div>
      <div class="clock"><b>${h12}:${String(d.getMinutes()).padStart(2,'0')}</b>
        <s>${ampm} · ${d.getMonth()+1}월 ${d.getDate()}일 ${day}요일</s></div>
      <div class="noti"><em>💌</em><span>
        <b>${esc(cfg.title||'새 방셀이 도착했어요')}</b>
        <s>${esc(cfg.sub||'밀어서 확인하기')}</s></span></div>
      <div class="track"><div class="fillx"></div>
        <span>${esc(cfg.label||'밀어서 열기')}</span><div class="grab"></div></div>`;
  },
  init(){
    const track=card.querySelector('.track'), grab=card.querySelector('.grab');
    const fill=card.querySelector('.fillx');
    const span=()=>track.clientWidth-56;
    drag(grab,{span,thresh:.82,
      onMove:p=>{ const x=p*span();
        grab.style.transform=`translateX(${x}px)`;
        fill.style.width=(x+50)+'px';
        card.classList.toggle('opening',p>.35); },
      onDone:()=>{ card.classList.add('opening');
        grab.style.transform=`translateX(${span()}px)`;

snowglobe: {
  html: () => `${cap}
    <div class="orb"><img src="${IMG}" alt=""><div class="flakes"></div><div class="glass"></div></div>
    <div class="stand"><b data-t="${esc((cfg.title||'SNOW GLOBE').slice(0,14))}"></b></div>
    <div class="shk"><span>흔들어보세요</span><u><i></i></u></div>`,
  init(){
    const box=card.querySelector('.flakes'), fl=[];
    // 크기별 3개 층 — 큰 눈은 앞에서 빠르게, 작은 눈은 뒤에서 느리게
    for(let i=0;i<66;i++){
      const s=document.createElement('i');
      const layer=i%3, d=[1.6,2.8,4.6][layer]+Math.random()*1.8;
      s.style.width=s.style.height=d+'px';
      s.style.left=(Math.random()*98)+'%';
      s.style.opacity=[.45,.72,.96][layer];
      box.appendChild(s);
      fl.push({el:s, y:Math.random()*100, v:[.028,.05,.082][layer]+Math.random()*.03,
               sw:Math.random()*6.28, amp:[1.6,3,4.6][layer]});
    }
    let energy=0, wobT=null;
    (function loop(){
      energy*=.9835;
      fl.forEach(f=>{
        f.y += f.v*(1+energy*4.5) - energy*f.v*16;   // 흔들면 위로 솟구침
        f.sw += .035 + energy*.06;
        if(f.y>103) f.y=-3; if(f.y<-5) f.y=102;
        f.el.style.top=f.y+'%';
        f.el.style.transform=`translateX(${Math.sin(f.sw)*(f.amp+energy*13)}px)`;
      });
      requestAnimationFrame(loop);            // 완료 후에도 계속 — 잔잔히 내림
    })();
    const im=card.querySelector('.orb img');
    const bar=card.querySelector('.shk i'), lbl=card.querySelector('.shk span');
    shake(card,2000,p=>{
      energy=Math.max(energy,p);
      bar.style.width=(p*100)+'%';
      lbl.textContent = p<.35?'흔들어보세요' : p<.75?'조금만 더!' : '거의 다 됐어요';
      im.style.filter=`blur(${8-p*8}px) brightness(${.62+p*.38}) saturate(${.66+p*.34})`;
      card.classList.add('wob');
      clearTimeout(wobT); wobT=setTimeout(()=>card.classList.remove('wob'),240);
    },()=>{
      card.classList.remove('wob'); im.style.filter='';
      finish(26,['#fff','#dff0ff','#bfe4ff',cfg.accent]);
    });
    return ()=>{ energy=1; bar.style.width='100%'; im.style.filter='';
      finish(26,['#fff','#dff0ff','#bfe4ff']); }; } },

slot: {
  html: () => `${prize()}${cap}<div class="cab"></div>
    <div class="machine">${'<div class="reel"><u></u></div>'.repeat(3)}</div>
    <div class="jack">JACKPOT!</div><div class="lever2" aria-label="레버"></div>
    ${hint('레버를 당기세요',false)}`,
  init(){
    const SYM=['🍒','🔔','⭐','🍋','7️⃣','🍇'], reels=[...card.querySelectorAll('.reel u')];
    const RH=52; reels.forEach(u=>{ let h='';
      for(let i=0;i<24;i++) h+=`<b>${SYM[i%SYM.length]}</b>`;
      h+='<b>7️⃣</b>'; u.innerHTML=h; });
    function spin(){ if(finished)return; card.classList.add('busy');
      reels.forEach((u,i)=>{ u.style.transition='none'; u.style.transform='translateY(0)';
        requestAnimationFrame(()=>{ u.style.transition=`transform ${1+i*.5}s cubic-bezier(.15,.6,.2,1)`;
          u.style.transform=`translateY(-${24*RH}px)`; }); });
      setTimeout(()=>{ card.classList.add('win'); sparks(26,['#ffd76b','#fff','#ff7f9c','#9ad8ff']);
        setTimeout(()=>finish(22,['#ffd76b','#fff',cfg.accent]),820); },2150); }
    card.querySelector('.lever2').addEventListener('click',e=>{e.stopPropagation();spin();});
    card.addEventListener('click',spin); return spin; } },

holo: {
  html: () => `<img class="prize a" src="${IMG}" alt=""><img class="prize b" src="${IMG2}" alt="">
    <div class="foil"></div>${cap}<div class="sheen"></div><div class="glare"></div>
    <div class="edge"></div>${hint('좌우로 기울여보세요',true)}`,
  init(){
    const A=card.querySelector('.prize.a'), B=card.querySelector('.prize.b');
    const sh=card.querySelector('.sheen'), fo=card.querySelector('.foil');
    let lo=1, hi=0;
    function tilt(p){
      const t=Math.min(1,Math.abs(p-.5)*2.3);     // 중앙=가림, 끝=선명
      A.style.opacity = p<.5 ? t : 0;
      B.style.opacity = p<.5 ? 0 : t;
      fo.style.opacity = (1-t*.94).toFixed(3);
      sh.style.transform=`translateX(${(p-.5)*52}%)`;
      sh.style.opacity=(.9-t*.55).toFixed(2);
      card.style.setProperty('--gx',(p*100).toFixed(0)+'%');
      lo=Math.min(lo,p); hi=Math.max(hi,p);
      if(!finished && lo<.2 && hi>.8) finish(18,['#ff4fa3','#4fd8ff','#c3ff6b','#fff']);
    }
    tilt(.5);
    card.addEventListener('pointermove',e=>{ const r=card.getBoundingClientRect();
      tilt(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))); });
    addEventListener('deviceorientation',e=>{ if(e.gamma!=null) tilt(Math.max(0,Math.min(1,(e.gamma+40)/80))); });
    return ()=>{ tilt(.06); setTimeout(()=>tilt(.94),420); }; } },

scan: {
  html: () => `<div class="dark"></div>${prize()}<div class="wire"></div>${cap}
    <div class="br"><i></i><i></i><i></i><i></i></div>
    <div class="ticks"><i></i><i></i></div>
    <div class="hud2"><span class="tl2">SCAN&nbsp;MODE<br>${esc(cfg.meta||'AUTO')}</span>
      <span class="tr2">${esc(cfg.lens||'SOOP-01')}<br>RGB&nbsp;24BIT</span>
      <span class="bl2">TARGET&nbsp;LOCKED</span></div>
    <div class="line"></div><div class="crt"></div>
    <div class="pctT"><b>READY</b><u><i></i></u></div>
    <div class="tick">✓</div><div class="ringF"></div>
    ${hint('눌러서 스캔 시작',true)}`,
  init(){
    const im=card.querySelector('.prize'), t=card.querySelector('.pctT b');
    const bar=card.querySelector('.pctT i'), ticks=[...card.querySelectorAll('.ticks i')];
    function go(){
      if(finished) return;
      card.classList.add('busy');
      im.style.clipPath='inset(0)';
      const t0=Date.now(), DUR=1900;
      const iv=setInterval(()=>{
        const p=Math.min(1,(Date.now()-t0)/DUR);
        t.textContent='SCANNING '+Math.round(p*100)+'%';
        bar.style.width=(p*100)+'%';
        ticks.forEach(el=>el.style.top=(p*100)+'%');   // 눈금이 스캔선 따라 이동
        if(p>=1){ clearInterval(iv); t.textContent='COMPLETE'; }
      },40);
      setTimeout(()=>finish(22,['#7dffcf','#fff','#9ad8ff',cfg.accent]),1920);
    }
    card.addEventListener('click',go); return go; } }

};

/* ══════════ 마운트 ══════════ */
const key = FX[cfg.fx] ? cfg.fx : 'scratch';
const fx = FX[key];
card.className = 'card ' + key + (fx.cls ? ' ' + fx.cls : '');
card.innerHTML = fx.html();
document.body.appendChild(card);
const trigger = fx.init();

card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){
  e.preventDefault(); trigger?trigger():finish(); }});
/* auto: 종이접기처럼 여러 번 눌러야 하는 효과도 끝까지 진행 */
if(cfg.auto){ let n=0;
  const iv=setInterval(()=>{ if(finished||n++>6){ clearInterval(iv); return; }
    trigger ? trigger() : finish(); },700); }

try{ new IntersectionObserver(es=>
  document.documentElement.classList.toggle('mk-off',!es[0].isIntersecting),{threshold:0}
).observe(document.documentElement); }catch(_){}
</script>
