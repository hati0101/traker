<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>widget</title>
<style>
/* ══════════════════════════════════════════════════════════════
   REVEAL RUNTIME v3
   규칙 1. 효과 전용 CSS 선택자는 FX 키와 글자 그대로 같을 것 (.cam ≠ .camera)
   규칙 2. 사진(.prize)은 z-index 1. 덮개는 10 이상, 사진 위로 올릴 것.
           (스캔이 z-index 11 검은판에 가려 안 보이는 사고 있었음)
   ══════════════════════════════════════════════════════════════ */
html,body{height:100%;margin:0;padding:0;overflow:hidden;background:transparent}
body{display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,system-ui,sans-serif}
.mk-off *{animation-play-state:paused!important}

.card{position:relative;overflow:hidden;border-radius:var(--radius,18px);
  width:min(var(--w,370px),92vw,calc(94vh*var(--ar,.7048)));
  aspect-ratio:var(--arr,74/105);
  box-shadow:0 14px 32px rgba(0,0,0,.3);cursor:pointer;outline:none;
  background:#0b0a0e;user-select:none;touch-action:none;perspective:1000px}
.card:focus-visible{outline:3px solid #ffd66b;outline-offset:4px}
.prize{position:absolute;inset:0;width:100%;height:100%;z-index:1;display:block;
  object-fit:var(--fit,cover);pointer-events:none}
.spark{position:absolute;z-index:60;pointer-events:none;will-change:transform,opacity}

.cap{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:40px 16px 14px;
  background:linear-gradient(transparent,rgba(6,5,9,.85));color:#f4f0f6;
  opacity:0;transform:translateY(10px);pointer-events:none;
  transition:opacity .6s ease .45s,transform .7s cubic-bezier(.16,.84,.32,1) .45s}
.done .cap{opacity:1;transform:none}
.cap h1{margin:0;font-size:17px;font-weight:700;line-height:1.35}
.cap p{margin:4px 0 0;font-size:12.5px;color:#cfc7d8}

.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:45;
  padding:7px 14px;border-radius:999px;font-size:11.5px;letter-spacing:.04em;color:#f0eaf4;
  background:rgba(10,9,14,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.18);
  pointer-events:none;transition:opacity .3s;white-space:nowrap}
.hint.mid{bottom:auto;top:50%;transform:translate(-50%,-50%)}
.done .hint,.busy .hint,.dragging .hint{opacity:0}

/* ─────────── 닦아내기 3종 공용 ─────────── */
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:20;
  touch-action:none;transition:opacity .8s ease;will-change:opacity}
.done #cv{opacity:0;pointer-events:none}
.wipe .prize{filter:var(--pre,none);transition:filter 1s ease}
.wipe.done .prize{filter:none}

/* ─────────── camera ─────────── */
.camera{background:#07070a}
/* 렌즈 상: 초점 헌팅 → 잠금 → 개방 */
.camera .prize{transform:scale(1.2);
  filter:blur(var(--blur,40px)) saturate(.34) brightness(.62) contrast(.92);
  transition:filter 1.25s cubic-bezier(.16,.84,.32,1),transform 1.4s cubic-bezier(.16,.84,.32,1);
  animation:hunt 3.4s ease-in-out infinite}
@keyframes hunt{0%,100%{filter:blur(var(--blur,40px)) saturate(.34) brightness(.62) contrast(.92)}
  44%{filter:blur(calc(var(--blur,40px)*.64)) saturate(.44) brightness(.72) contrast(.96)}}
.camera.busy .prize{animation:none;transition:filter .42s ease,transform .42s ease;
  transform:scale(1.15);filter:blur(calc(var(--blur,40px)*.34)) saturate(.5) brightness(.78)}
.camera.done .prize{animation:none;transform:scale(1);
  filter:blur(0) saturate(1.06) brightness(1.02) contrast(1.02)}

/* 렌즈 보케 — 흐릴 때만 떠다니는 빛망울 */
.camera .bokeh{position:absolute;inset:0;z-index:2;pointer-events:none;
  transition:opacity .8s ease}
.camera .bokeh i{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,rgba(255,255,255,.34),rgba(255,225,240,.1) 60%,transparent 74%);
  animation:float var(--d,7s) ease-in-out infinite alternate}
@keyframes float{to{transform:translate(var(--tx,14px),var(--ty,-18px)) scale(1.14)}}
.camera.done .bokeh{opacity:0}

/* 뷰파인더 HUD */
.camera .hud{position:absolute;inset:0;z-index:12;pointer-events:none;
  font:600 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;
  color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(0,0,0,.7);
  transition:opacity .5s ease}
.camera.done .hud{opacity:0}
.camera .hud .tl{position:absolute;left:7%;top:5.5%;display:flex;align-items:center;gap:5px}
.camera .hud .tr{position:absolute;right:7%;top:5.5%}
.camera .hud .bl{position:absolute;left:7%;bottom:5.5%}
.camera .hud .brr{position:absolute;right:7%;bottom:5.5%}
.camera .hud .rec{width:6px;height:6px;border-radius:50%;background:#ff4d5e;
  box-shadow:0 0 7px #ff4d5e;animation:blink 1.5s steps(1) infinite}
@keyframes blink{50%{opacity:.2}}
.camera .hud .bat{display:inline-block;width:16px;height:8px;border:1px solid rgba(255,255,255,.7);
  border-radius:2px;position:relative;vertical-align:-1px;margin-left:5px}
.camera .hud .bat::before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:64%;
  background:rgba(255,255,255,.8);border-radius:1px}
.camera .hud .bat::after{content:"";position:absolute;right:-3px;top:2px;bottom:2px;width:2px;
  background:rgba(255,255,255,.7);border-radius:0 1px 1px 0}

/* 구도 그리드 */
.grid{position:absolute;inset:0;z-index:11;opacity:.4;transition:opacity .45s;pointer-events:none}
.grid i{position:absolute;background:rgba(255,255,255,.26)}
.grid i:nth-child(1){left:33.33%;top:0;bottom:0;width:1px}
.grid i:nth-child(2){left:66.66%;top:0;bottom:0;width:1px}
.grid i:nth-child(3){top:33.33%;left:0;right:0;height:1px}
.grid i:nth-child(4){top:66.66%;left:0;right:0;height:1px}
.done .grid{opacity:0}

/* AF 프레임 — 크게 떠다니다 중앙으로 수축하며 잠김 */
.fc{position:absolute;left:50%;top:46%;width:58%;aspect-ratio:1/1;z-index:13;pointer-events:none;
  transform:translate(-50%,-50%);
  transition:transform .5s cubic-bezier(.3,1.3,.4,1),width .5s cubic-bezier(.3,1.3,.4,1),opacity .4s;
  animation:afdrift 3.4s ease-in-out infinite}
@keyframes afdrift{0%,100%{transform:translate(-50%,-50%)}
  35%{transform:translate(-56%,-53%)}70%{transform:translate(-45%,-47%)}}
.fc b{position:absolute;width:20%;height:20%;border:2px solid rgba(255,255,255,.75);
  transition:border-color .3s}
.fc b:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:3px 0 0 0}
.fc b:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 3px 0 0}
.fc b:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 3px}
.fc b:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 3px 0}
.camera.busy .fc{animation:none;width:36%;transform:translate(-50%,-50%) scale(1)}
.camera.busy .fc b{border-color:var(--accent);box-shadow:0 0 9px rgba(255,127,156,.65)}
.camera.lock .fc{animation:lockpulse .34s ease-out}
@keyframes lockpulse{0%{transform:translate(-50%,-50%) scale(1.14)}
  100%{transform:translate(-50%,-50%) scale(1)}}
.done .fc{opacity:0}
/* 초점 잠금 표시 */
.camera .afok{position:absolute;left:50%;top:46%;z-index:14;transform:translate(-50%,152%);
  font:700 9px/1 ui-monospace,monospace;letter-spacing:.18em;color:var(--accent);
  opacity:0;transition:opacity .2s;text-shadow:0 0 8px rgba(255,127,156,.7)}
.camera.lock .afok{opacity:1}
.done .afok{opacity:0!important}

/* 셔터 블레이드 — 위아래 + 좌우 4장 */
.blade{position:absolute;background:#05050880;z-index:22;backdrop-filter:blur(2px)}
.blade.t{left:0;right:0;top:0;height:52%;transform:translateY(-101%)}
.blade.b{left:0;right:0;bottom:0;height:52%;transform:translateY(101%)}
.blade.l{top:0;bottom:0;left:0;width:52%;transform:translateX(-101%)}
.blade.r{top:0;bottom:0;right:0;width:52%;transform:translateX(101%)}
.snap .blade.t{animation:bt .3s cubic-bezier(.3,0,.3,1)}
.snap .blade.b{animation:bb .3s cubic-bezier(.3,0,.3,1)}
.snap .blade.l{animation:bl .3s cubic-bezier(.3,0,.3,1) .03s}
.snap .blade.r{animation:br2 .3s cubic-bezier(.3,0,.3,1) .03s}
@keyframes bt{0%,100%{transform:translateY(-101%)}46%{transform:translateY(0)}}
@keyframes bb{0%,100%{transform:translateY(101%)}46%{transform:translateY(0)}}
@keyframes bl{0%,100%{transform:translateX(-101%)}46%{transform:translateX(0)}}
@keyframes br2{0%,100%{transform:translateX(101%)}46%{transform:translateX(0)}}

/* 플래시 — 화이트아웃 + 대각 스윕 + 렌즈 플레어 */
.pop{position:absolute;inset:0;z-index:24;background:#fff;opacity:0;pointer-events:none}
.snap .pop{animation:pp .34s ease-out .1s}
@keyframes pp{0%,100%{opacity:0}16%{opacity:.97}}
.sweep{position:absolute;inset:-25% -60%;z-index:25;opacity:0;pointer-events:none;
  background:linear-gradient(102deg,transparent 34%,rgba(255,255,255,.98) 48%,
    rgba(255,235,245,.72) 55%,transparent 68%)}
.snap .sweep{animation:sw .66s cubic-bezier(.3,.02,.2,1) .16s}
@keyframes sw{0%{opacity:0;transform:translateX(-72%)}18%{opacity:1}100%{opacity:0;transform:translateX(72%)}}
.flare{position:absolute;inset:0;z-index:26;opacity:0;pointer-events:none;mix-blend-mode:screen;
  background:
    radial-gradient(circle at 30% 32%,rgba(255,235,190,.75),transparent 16%),
    radial-gradient(circle at 52% 48%,rgba(190,235,255,.55),transparent 11%),
    radial-gradient(circle at 70% 64%,rgba(255,190,220,.6),transparent 14%)}
.snap .flare{animation:fl .78s ease-out .16s}
@keyframes fl{0%,100%{opacity:0;transform:scale(.85)}26%{opacity:1}100%{transform:scale(1.25)}}

/* 노출 프레임 — 촬영 직후 사진이 자리잡는 느낌 */
.camera.done .frameFlash{animation:frameIn .6s cubic-bezier(.3,1.2,.4,1)}
.frameFlash{position:absolute;inset:0;z-index:27;pointer-events:none;border-radius:inherit;
  box-shadow:0 0 0 0 rgba(255,255,255,0) inset}
@keyframes frameIn{0%{box-shadow:0 0 0 5px rgba(255,255,255,.75) inset}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0) inset}}

/* 셔터 버튼 */
.shut{position:absolute;left:50%;bottom:15px;transform:translateX(-50%);z-index:46;
  width:58px;height:58px;border:0;border-radius:50%;cursor:pointer;padding:0;
  background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
  box-shadow:0 0 0 2px rgba(255,255,255,.55) inset,0 6px 18px -4px rgba(0,0,0,.7);
  transition:transform .16s,opacity .4s;display:grid;place-items:center}
.shut::after{content:"";width:44px;height:44px;border-radius:50%;
  background:radial-gradient(circle at 42% 34%,#fff 0 38%,#ffd2dd 39% 62%,var(--accent) 63%);
  transition:transform .16s,background .3s}
.shut:active::after{transform:scale(.86)}
.camera.busy .shut::after{background:radial-gradient(circle at 42% 34%,#fff5f8 0 40%,#ffbccc 41% 66%,#e0567a 67%)}
.done .shut{opacity:0;pointer-events:none}
.shut:focus-visible{outline:2px solid #fff;outline-offset:4px}

/* ─────────── polaroid ─────────── */
.polaroid{background:#14121a}
.polaroid .slot{position:absolute;left:6%;right:6%;top:3%;height:9px;z-index:24;border-radius:3px;
  background:linear-gradient(#000,#2a2533);box-shadow:0 4px 14px rgba(0,0,0,.8)}
.polaroid .frame{position:absolute;left:4%;right:4%;top:4%;z-index:14;
  background:linear-gradient(#fffefb,#f2eee4);padding:4.5% 4.5% 13%;border-radius:3px;
  box-shadow:0 14px 30px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.6) inset;
  transform:translateY(-116%);animation:eject 1.15s cubic-bezier(.2,.9,.3,1) .3s forwards}
@keyframes eject{to{transform:translateY(0)}}
.polaroid .win{position:relative;width:100%;aspect-ratio:1/1.18;overflow:hidden;background:#1d2029;
  box-shadow:0 1px 5px rgba(0,0,0,.35) inset}
.polaroid .win img{width:100%;height:100%;object-fit:cover;display:block;
  filter:brightness(.22) contrast(.35) sepia(.75) blur(4px);transition:filter .5s ease}
.polaroid .memo{margin-top:7%;text-align:center;font-size:13px;color:#5b5361;letter-spacing:.01em}
.polaroid .bar{position:absolute;left:8%;right:8%;bottom:6%;height:5px;z-index:26;
  border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;transition:opacity .4s}
.polaroid .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px}
.polaroid.done .bar{opacity:0}

/* ─────────── film ─────────── */
.film{background:#08070b}
.film .gate{position:absolute;top:9%;bottom:9%;left:0;right:0;z-index:12;overflow:hidden}
.film .strip{position:absolute;top:0;bottom:0;left:0;display:flex;will-change:transform}
.film .fr{flex:0 0 var(--fw,100%);height:100%;position:relative;overflow:hidden;
  border-right:3px solid #08070b;background:#16121d}
.film .fr img{width:100%;height:100%;object-fit:cover;display:block}
.film .fr.blank{background:
  radial-gradient(circle at 50% 42%,rgba(255,255,255,.05),transparent 60%),
  repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 10px,transparent 10px 22px),#171320}
.film .fr.blank::after{content:attr(data-n);position:absolute;left:8px;bottom:7px;
  color:#6c6182;font-size:10px;letter-spacing:.24em}
.film.busy .gate{animation:gateShake .62s cubic-bezier(.3,.7,.4,1)}
@keyframes gateShake{0%,100%{transform:translateY(0)}
  18%{transform:translateY(-2px)}42%{transform:translateY(2px)}68%{transform:translateY(-1px)}}
.film.busy .strip{filter:blur(1.6px)}
.film .perf{position:absolute;left:0;right:0;height:9%;z-index:14;background:#08070b;
  overflow:hidden}
.film .perf.t{top:0}.film .perf.b{bottom:0}
.film .perf u{position:absolute;left:0;top:50%;display:flex;text-decoration:none;
  transform:translateY(-50%);will-change:transform}
.film .perf u i{display:block;width:11px;height:8px;margin-right:13px;border-radius:2px;
  background:#e9e3f0;flex:0 0 auto}
.film .lever{position:absolute;right:12px;bottom:15%;width:46px;height:46px;z-index:46;
  border-radius:50%;border:2px solid #7a7091;background:radial-gradient(circle at 38% 32%,#332c40,#1c1826);
  cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.5);
  transition:transform .85s cubic-bezier(.25,.85,.3,1),opacity .4s}
.film .lever::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:16px;
  margin-left:-2px;border-radius:2px;background:var(--accent)}
.film.busy .lever{transform:rotate(1080deg)}
.film.done .lever{opacity:0;pointer-events:none}
.film .counter{position:absolute;right:12px;top:12%;z-index:46;color:#8e83a8;
  font-size:11px;letter-spacing:.18em;transition:opacity .4s}
.film.done .counter{opacity:0}
.film.done .gate{top:0;bottom:0;transition:top .6s ease .25s,bottom .6s ease .25s}
.film.done .perf{opacity:0;transition:opacity .5s .25s}

/* ─────────── gift ─────────── */
.gift{background:#17131c}
.gift .bg2{position:absolute;inset:0;z-index:13;background:#17131c;
  transition:opacity .6s ease .25s}
.gift.done .bg2{opacity:0;transition:opacity .5s ease .05s}
.gift .base{position:absolute;left:3%;right:3%;top:30%;bottom:4%;z-index:14;overflow:hidden;
  border-radius:3px 3px 6px 6px;
  background:linear-gradient(100deg,#b8637f 0 7%,#e79ab2 14%,#f0aec3 46%,#dd8ea8 78%,#b8637f);
  box-shadow:0 10px 24px rgba(0,0,0,.5);
  transition:transform .85s cubic-bezier(.5,0,.6,1) .12s,opacity .6s ease .3s}
.gift .base::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;
  background:linear-gradient(rgba(0,0,0,.45),transparent)}
.gift .base .rv{position:absolute;left:42%;width:16%;top:0;bottom:0;
  background:linear-gradient(90deg,#d9a52f,#fff6d4 32%,#ffe08a 58%,#cf9c28)}
.gift .lid{position:absolute;left:0;right:0;top:6%;height:26%;z-index:18;overflow:visible;
  border-radius:5px;transform-origin:50% 100%;
  background:linear-gradient(100deg,#c9758f 0 6%,#fbd2df 13%,#f7c4d3 48%,#e6a3b9 80%,#c9758f);
  box-shadow:0 9px 18px rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.55) inset;
  transition:transform .9s cubic-bezier(.35,1.3,.5,1),opacity .55s ease .3s}
.gift .lid::after{content:"";position:absolute;left:0;right:0;bottom:0;height:22%;
  background:linear-gradient(transparent,rgba(120,50,75,.35))}
.gift .lid .rv{position:absolute;left:42%;width:16%;top:0;bottom:0;
  background:linear-gradient(90deg,#d9a52f,#fff6d4 32%,#ffe08a 58%,#cf9c28)}
.gift .lid .rh{position:absolute;left:0;right:0;top:34%;height:30%;
  background:linear-gradient(#fff6d4,#ffe08a 55%,#d9a52f)}
.gift .bow{position:absolute;left:50%;top:28%;width:46%;aspect-ratio:1/.66;z-index:22;
  transform:translate(-50%,-50%);cursor:grab;
  transition:transform .5s cubic-bezier(.4,1.4,.5,1)}
.gift .bow svg{width:100%;height:100%;display:block;
  filter:drop-shadow(0 3px 5px rgba(90,58,8,.45))}
.gift.done .lid{transform:translateY(-150%) rotate(-16deg);opacity:0}
.gift.done .base{transform:translateY(130%);opacity:0}

/* ─────────── gacha ─────────── */
.gacha .hous{position:absolute;inset:0;z-index:12;
  background:linear-gradient(#f8dbe6 0 52%,#e9536f 52% 100%);transition:opacity .6s}
.gacha .hous::after{content:"";position:absolute;left:0;right:0;top:52%;height:5px;
  background:rgba(0,0,0,.22)}
.gacha .dome{position:absolute;left:7%;right:7%;top:5%;height:45%;z-index:14;
  border-radius:50% 50% 12% 12%;
  background:radial-gradient(circle at 33% 26%,rgba(255,255,255,.85),rgba(214,236,250,.45) 46%,rgba(150,186,214,.3));
  border:2px solid rgba(255,255,255,.6);box-shadow:0 6px 18px rgba(0,0,0,.16);transition:opacity .6s}
.gacha .balls{position:absolute;left:7%;right:7%;top:5%;height:45%;z-index:15;transition:opacity .6s}
.gacha .balls i{position:absolute;width:17%;aspect-ratio:1/1;border-radius:50%;
  box-shadow:inset -3px -4px 7px rgba(0,0,0,.22),0 1px 3px rgba(0,0,0,.2)}
.gacha .tray{position:absolute;left:22%;right:22%;bottom:6%;height:15%;z-index:16;
  border-radius:8px 8px 5px 5px;background:linear-gradient(#5d1626,#8d2740);
  box-shadow:0 3px 8px rgba(0,0,0,.35) inset;transition:opacity .5s}
.gacha .cap2{position:absolute;left:50%;top:58%;width:40%;aspect-ratio:1/1;z-index:48;
  transform:translate(-50%,-190%) scale(.4);opacity:0;border-radius:50%;
  background:linear-gradient(#fff2f6 0 50%,var(--accent) 50% 100%);
  box-shadow:0 6px 16px rgba(0,0,0,.4),-4px -5px 10px rgba(255,255,255,.5) inset}
.gacha.busy .cap2{animation:drop .9s cubic-bezier(.35,1.5,.5,1) forwards}
@keyframes drop{0%{transform:translate(-50%,-190%) scale(.5);opacity:0}
  18%{opacity:1}58%{transform:translate(-50%,10%) scale(1)}
  72%{transform:translate(-50%,-16%) scale(1.06)}86%{transform:translate(-50%,4%) scale(1);opacity:1}
  100%{transform:translate(-50%,0) scale(1);opacity:1}}
.gacha .half{position:absolute;left:50%;top:58%;width:40%;height:20%;z-index:49;opacity:0;
  transform:translate(-50%,0);transition:transform .7s cubic-bezier(.3,1,.3,1),opacity .5s}
.gacha .half.up{border-radius:999px 999px 0 0;background:#fff2f6;margin-top:-20%}
.gacha .half.dn{border-radius:0 0 999px 999px;background:var(--accent)}
.gacha.done .hous,.gacha.done .dome,.gacha.done .balls,
.gacha.done .knob,.gacha.done .tray,.gacha.done .cap2{opacity:0}
.gacha.done .half.up{animation:splitU 1s cubic-bezier(.25,.9,.3,1) forwards}
.gacha.done .half.dn{animation:splitD 1s cubic-bezier(.25,.9,.3,1) forwards}
@keyframes splitU{0%{opacity:1;transform:translate(-50%,0) rotate(0)}
  62%{opacity:1}100%{opacity:0;transform:translate(-50%,-300%) rotate(-32deg)}}
@keyframes splitD{0%{opacity:1;transform:translate(-50%,0) rotate(0)}
  62%{opacity:1}100%{opacity:0;transform:translate(-50%,300%) rotate(28deg)}}

let finished = false;
function sparks(n,col){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = col || ['#fff','#ffd2dd',cfg.accent,'#fff0b8'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span'); s.className='spark';
    s.textContent = Math.random()<.6?'✦':'•';
    s.style.cssText += `left:50%;top:48%;font:700 ${8+Math.random()*14}px sans-serif;color:${cols[i%cols.length]};
      text-shadow:0 0 8px rgba(255,200,220,.9);transform:translate(-50%,-50%)`;
    card.appendChild(s);
    const a=Math.random()*6.283, d=70+Math.random()*140;
    s.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},
      {transform:`translate(calc(-50% + ${Math.cos(a)*d}px),calc(-50% + ${Math.sin(a)*d-20}px)) scale(1.15) rotate(${Math.random()*220-110}deg)`,opacity:0}],
      {duration:620+Math.random()*420,easing:'cubic-bezier(.15,.75,.4,1)'}).onfinish=()=>s.remove();
  }
}
function finish(n=14,col){ if(finished) return; finished=true;
  card.classList.remove('busy'); card.classList.add('done'); sparks(n,col); }

function drag(el,{axis='x',span=()=>card.clientWidth*.42,onMove,thresh=.55,onDone,onCancel}){
  let start=null, p=0;
  el.addEventListener('pointerdown',e=>{ if(finished) return;
    start = axis==='x'?e.clientX:e.clientY; card.classList.add('dragging');
    card.classList.remove('smooth');
    try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove',e=>{ if(start===null||finished) return;
    const cur = axis==='x'?e.clientX:e.clientY;
    p = Math.max(0,Math.min(1,Math.abs(cur-start)/span())); onMove && onMove(p); });
  const up=()=>{ if(start===null) return; start=null; card.classList.remove('dragging');
    card.classList.add('smooth');
    if(p>thresh) onDone && onDone(); else { onCancel&&onCancel(); onMove&&onMove(0);
      setTimeout(()=>card.classList.remove('smooth'),900); } };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
}
function shake(el,need,onProg,onDone){
  let acc=0,lx=null,ly=null;
  el.addEventListener('pointermove',e=>{ if(finished) return;
    if(lx!==null){ acc += Math.hypot(e.clientX-lx,e.clientY-ly); onProg&&onProg(Math.min(1,acc/need));
      if(acc>need) onDone(); }
    lx=e.clientX; ly=e.clientY; });
}

/* ══════════ 닦아내기 엔진 ══════════ */
function wipeFx({paint,pre,label,noHint}){ return {
  cls:'wipe',
  html: () => `${prize()}${cap}<canvas id="cv"></canvas>${noHint?'':hint(label,true)}`,
  init(){
    if(pre) card.style.setProperty('--pre',pre);
    const cv=card.querySelector('#cv'), dpr=Math.min(devicePixelRatio||1,2);
    let ctx,W,H,grid,cnt,drawing=false,lx,ly,sid=null;
    const GW=18,GH=24,total=GW*GH;
    function setup(){
      W=cv.width=Math.round(card.clientWidth*dpr); H=cv.height=Math.round(card.clientHeight*dpr);
      ctx=cv.getContext('2d'); grid=new Array(total); cnt=0;
      ctx.globalCompositeOperation='source-over'; paint(ctx,W,H,dpr);
      if(cfg.cover){ const im=new Image(); im.onload=()=>{ if(cnt===0&&!finished){
        ctx.globalCompositeOperation='source-over';
        const f=Math.max(W/im.width,H/im.height);
        ctx.drawImage(im,W/2-im.width*f/2,H/2-im.height*f/2,im.width*f,im.height*f); } };
        im.src=cfg.cover; }
    }
    function mark(x,y){ const R=W*.085,cx=Math.floor(x/W*GW),cy=Math.floor(y/H*GH),rr=Math.ceil(R/(W/GW));
      for(let i=cx-rr;i<=cx+rr;i++)for(let j=cy-rr;j<=cy+rr;j++){
        if(i<0||j<0||i>=GW||j>=GH)continue; const k=j*GW+i; if(!grid[k]){grid[k]=1;cnt++;} }
      if(!finished&&cnt/total>cfg.pct) finish(); }
    function draw(x,y){ ctx.globalCompositeOperation='destination-out';
      ctx.lineWidth=W*.17; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#000';
      ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(x,y); ctx.stroke(); lx=x; ly=y; mark(x,y); }
    const pos=e=>{ const r=cv.getBoundingClientRect();
      return [(e.clientX-r.left)*W/Math.max(1,r.width),(e.clientY-r.top)*H/Math.max(1,r.height)]; };
    cv.addEventListener('pointerdown',e=>{ if(drawing)return; sid=e.pointerId; drawing=true;
      const p=pos(e); lx=p[0]; ly=p[1]; draw(p[0]+.1,p[1]+.1);
      try{cv.setPointerCapture(e.pointerId);}catch(_){} });
    cv.addEventListener('pointermove',e=>{ if(drawing&&e.pointerId===sid){const p=pos(e);draw(p[0],p[1]);} });
    const up=e=>{ if(e.pointerId===sid){drawing=false;sid=null;} };
    cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
    setup(); let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!finished)setup();},250);});
    return ()=>finish();
  }};
}
/* 둥근 사각 경로 (구버전 사파리 roundRect 없음 대비) */
function rrect(c,x,y,w,h,r){ c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }

    const L=card.querySelector('.pan.l'), R=card.querySelector('.pan.r');
    const set=p=>{ L.style.transform=`translateX(${-p*101}%)`; R.style.transform=`translateX(${p*101}%)`; };
    drag(card,{onMove:set,onDone:()=>{ L.style.transform=R.style.transform=''; finish(18); }});
    return ()=>{ card.classList.add('smooth'); L.style.transform=R.style.transform=''; finish(18); }; } },

blind: {
  html: () => `${prize()}${cap}<div class="slats"></div><div class="cordB"></div>
    ${hint('위로 올려서 걷기',true)}`,
  init(){
    const s=card.querySelector('.slats'), cord=card.querySelector('.cordB');
    for(let i=0;i<14;i++) s.appendChild(document.createElement('i'));
    const its=[...s.children];
    drag(card,{axis:'y',span:()=>card.clientHeight*.4,
      onMove:p=>{ its.forEach((el,i)=>{ const d=Math.max(0,Math.min(1,p*1.5-i/its.length*.5));
        el.style.transform=`scaleY(${1-d*.96})`; el.style.opacity=1-d; });
        cord.style.height=(38-p*30)+'%'; },
      onDone:()=>{ its.forEach(el=>el.style.cssText=''); cord.style.height=''; finish(16); }});
    return ()=>{ card.classList.add('smooth'); finish(16); }; } },

blackout: {
  html: () => `${prize()}${cap}<div class="veil"></div>${hint('쓸어서 걷어내기',true)}`,
  init(){
    const v=card.querySelector('.veil');
    drag(card,{onMove:p=>{ v.style.clipPath=`inset(0 0 0 ${p*105}%)`; },
      onDone:()=>{ v.style.clipPath='inset(0 0 0 105%)'; finish(16); }});
    return ()=>{ card.classList.add('smooth'); v.style.clipPath='inset(0 0 0 105%)'; finish(16); }; } },

unlock: {
  html: () => `${prize()}${cap}<div class="veilU"></div>
    <div class="track"><span>${esc(cfg.label||'밀어서 열기')}</span><div class="grab"></div></div>`,
  init(){
    const track=card.querySelector('.track'), grab=card.querySelector('.grab');
    drag(grab,{span:()=>track.clientWidth-52,thresh:.85,
      onMove:p=>{ grab.style.transform=`translateX(${p*(track.clientWidth-52)}px)`; },
      onDone:()=>{ grab.style.transform=`translateX(${track.clientWidth-52}px)`; finish(16); },
      onCancel:()=>{ grab.style.transform='translateX(0)'; }});
    return ()=>finish(16); } },

origami: {
  html: () => `${prize()}${cap}<div class="fold f1"></div><div class="fold f2"></div>
    <div class="fold f3"></div><div class="fold f4"></div><div class="step">1</div>
    ${hint('눌러서 한 겹씩 펼치기',false)}`,
  init(){
    const f=[...card.querySelectorAll('.fold')], st=card.querySelector('.step');
    let i=0;
    function next(){ if(finished||i>=f.length)return; f[i].classList.add('open'); i++;
      st.textContent = i<f.length ? i+1 : '';
      if(i>=f.length) setTimeout(()=>finish(20,['#fdf6ec','#ffd2dd','#fff',cfg.accent]),560); }
    card.addEventListener('click',next); return next; } },

snowglobe: {
  html: () => `${prize()}${cap}<div class="flakes"></div><div class="glass"></div><div class="stand"></div>
    ${hint('흔들어보세요',true)}`,
  init(){
    const box=card.querySelector('.flakes'), fl=[];
    for(let i=0;i<58;i++){ const s=document.createElement('i');
      const d=2+Math.random()*5; s.style.width=s.style.height=d+'px';
      s.style.left=(Math.random()*96)+'%'; box.appendChild(s);
      fl.push({el:s,y:Math.random()*100,v:.045+Math.random()*.1,sw:Math.random()*6.28}); }
    let energy=0;
    (function loop(){
      energy*=.978;                       // 흔든 힘은 서서히 가라앉고
      fl.forEach(f=>{
        f.y += f.v*(1+energy*5) - energy*f.v*14;   // 에너지가 있으면 위로 솟구침
        f.sw += .04 + energy*.05;
        if(f.y>102) f.y=-3; if(f.y<-5) f.y=101;
        f.el.style.top=f.y+'%';
        f.el.style.transform=`translateX(${Math.sin(f.sw)*(2.5+energy*11)}px)`;
      });
      requestAnimationFrame(loop);        // 완료 뒤에도 계속 — 잔잔히 내림
    })();
    const im=card.querySelector('.prize');
    shake(card,1800,p=>{ energy=Math.max(energy,p);
      im.style.filter=`blur(${7-p*7}px) brightness(${.7+p*.3}) saturate(${.7+p*.3})`; },
      ()=>{ im.style.filter=''; finish(24,['#fff','#dff0ff','#bfe4ff',cfg.accent]); });
    return ()=>{ energy=1; im.style.filter=''; finish(24,['#fff','#dff0ff','#bfe4ff']); }; } },

slot: {
  html: () => `${prize()}${cap}<div class="cab"></div>
    <div class="machine">${'<div class="reel"><u></u></div>'.repeat(3)}</div>
    <div class="jack">JACKPOT!</div><div class="lever2" aria-label="레버"></div>
    ${hint('레버를 당기세요',false)}`,
  init(){
    const SYM=['🍒','🔔','⭐','🍋','7️⃣','🍇'], reels=[...card.querySelectorAll('.reel u')];
    const RH=52; reels.forEach(u=>{ let h='';
      for(let i=0;i<24;i++) h+=`<b>${SYM[i%SYM.length]}</b>`;
      h+='<b>7️⃣</b>'; u.innerHTML=h; });
    function spin(){ if(finished)return; card.classList.add('busy');
      reels.forEach((u,i)=>{ u.style.transition='none'; u.style.transform='translateY(0)';
        requestAnimationFrame(()=>{ u.style.transition=`transform ${1+i*.5}s cubic-bezier(.15,.6,.2,1)`;
          u.style.transform=`translateY(-${24*RH}px)`; }); });
      setTimeout(()=>{ card.classList.add('win'); sparks(26,['#ffd76b','#fff','#ff7f9c','#9ad8ff']);
        setTimeout(()=>finish(22,['#ffd76b','#fff',cfg.accent]),820); },2150); }
    card.querySelector('.lever2').addEventListener('click',e=>{e.stopPropagation();spin();});
    card.addEventListener('click',spin); return spin; } },

holo: {
  html: () => `<img class="prize a" src="${IMG}" alt=""><img class="prize b" src="${IMG2}" alt="">
    <div class="foil"></div>${cap}<div class="sheen"></div><div class="glare"></div>
    <div class="edge"></div>${hint('좌우로 기울여보세요',true)}`,
  init(){
    const A=card.querySelector('.prize.a'), B=card.querySelector('.prize.b');
    const sh=card.querySelector('.sheen'), fo=card.querySelector('.foil');
    let lo=1, hi=0;
    function tilt(p){
      const t=Math.min(1,Math.abs(p-.5)*2.3);     // 중앙=가림, 끝=선명
      A.style.opacity = p<.5 ? t : 0;
      B.style.opacity = p<.5 ? 0 : t;
      fo.style.opacity = (1-t*.94).toFixed(3);
      sh.style.transform=`translateX(${(p-.5)*52}%)`;
      sh.style.opacity=(.9-t*.55).toFixed(2);
      card.style.setProperty('--gx',(p*100).toFixed(0)+'%');
      lo=Math.min(lo,p); hi=Math.max(hi,p);
      if(!finished && lo<.2 && hi>.8) finish(18,['#ff4fa3','#4fd8ff','#c3ff6b','#fff']);
    }
    tilt(.5);
    card.addEventListener('pointermove',e=>{ const r=card.getBoundingClientRect();
      tilt(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))); });
    addEventListener('deviceorientation',e=>{ if(e.gamma!=null) tilt(Math.max(0,Math.min(1,(e.gamma+40)/80))); });
    return ()=>{ tilt(.06); setTimeout(()=>tilt(.94),420); }; } },

scan: {
  html: () => `<div class="dark"></div>${prize()}${cap}
    <div class="br"><i></i><i></i><i></i><i></i></div>
    <div class="line"></div><div class="pctT">READY</div><div class="tick">✓</div>
    ${hint('눌러서 스캔 시작',true)}`,
  init(){
    const im=card.querySelector('.prize'), t=card.querySelector('.pctT');
    function go(){ if(finished)return; card.classList.add('busy');
      im.style.clipPath='inset(0)';
      const t0=Date.now(), iv=setInterval(()=>{ const p=Math.min(100,(Date.now()-t0)/16);
        t.textContent='SCANNING '+p.toFixed(0)+'%'; if(p>=100) clearInterval(iv); },60);
      setTimeout(()=>finish(20,['#7dffcf','#fff','#9ad8ff']),1620); }
    card.addEventListener('click',go); return go; } }
};

/* ══════════ 마운트 ══════════ */
const key = FX[cfg.fx] ? cfg.fx : 'scratch';
const fx = FX[key];
card.className = 'card ' + key + (fx.cls ? ' ' + fx.cls : '');
card.innerHTML = fx.html();
document.body.appendChild(card);
const trigger = fx.init();

card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){
  e.preventDefault(); trigger?trigger():finish(); }});
/* auto: 종이접기처럼 여러 번 눌러야 하는 효과도 끝까지 진행 */
if(cfg.auto){ let n=0;
  const iv=setInterval(()=>{ if(finished||n++>6){ clearInterval(iv); return; }
    trigger ? trigger() : finish(); },700); }

try{ new IntersectionObserver(es=>
  document.documentElement.classList.toggle('mk-off',!es[0].isIntersecting),{threshold:0}
).observe(document.documentElement); }catch(_){}
</script>
</body>
</html>
